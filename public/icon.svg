      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0b0f19" />
  <circle cx="256" cy="256" r="210" fill="url(#glow)" />
  <!-- Comet trail -->
  <path d="M120 392 C160 380, 240 300, 340 180 C310 240, 240 330, 120 392 Z" fill="url(#cometGrad)" opacity="0.75" />
